
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropbox PDF Storage</title>
</head>
<body>
    <h1>Dropbox Cloud Storage</h1>

    <h2>Upload PDF</h2>
    <input type="file" id="pdfFile" accept=".pdf,application/pdf">
    <button id="uploadBtn">Upload PDF</button>
    <p id="message"></p>

    <hr>

    <h2>Files in Dropbox</h2>
    <button id="viewBtn">View Files</button>
    <ul id="fileList"></ul>

    <script>
        const API = "http://localhost:5000";

        document.getElementById("uploadBtn").addEventListener("click", async () => {
            const file = document.getElementById("pdfFile").files[0];
            const message = document.getElementById("message");

            if (!file) {
                message.textContent = "Please select a PDF file.";
                return;
            }

            if (file.type !== "application/pdf" &&
                !file.name.toLowerCase().endsWith(".pdf")) {
                message.textContent = "Please select a PDF file.";
                return;
            }

            const formData = new FormData();
            formData.append("pdf", file);

            try {
                message.textContent = "Uploading...";
                const response = await fetch(API + "/upload", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.error);

                message.textContent = data.message + ": " + data.name;
                document.getElementById("pdfFile").value = "";
                document.getElementById("viewBtn").click();
            } catch (error) {
                message.textContent = "Upload failed: " + error.message;
            }
        });

        document.getElementById("viewBtn").addEventListener("click", async () => {
            const list = document.getElementById("fileList");
            list.replaceChildren();

            try {
                const response = await fetch(API + "/files");
                const files = await response.json();

                if (!response.ok) throw new Error(files.error);

                if (files.length === 0) {
                    list.textContent = "No files found.";
                    return;
                }

                files.forEach(file => {
                    const item = document.createElement("li");
                    item.appendChild(document.createTextNode(file.name + " "));

                    if (file.type === "file" &&
                        file.name.toLowerCase().endsWith(".pdf")) {
                        const button = document.createElement("button");
                        button.textContent = "Download PDF";

                        button.addEventListener("click", async () => {
                            try {
                                button.disabled = true;
                                const url = API + "/download?path=" +
                                    encodeURIComponent(file.path);

                                const downloadResponse = await fetch(url);
                                if (!downloadResponse.ok) {
                                    throw new Error(await downloadResponse.text());
                                }

                                const blob = await downloadResponse.blob();
                                const link = document.createElement("a");
                                link.href = URL.createObjectURL(blob);
                                link.download = file.name;
                                link.click();
                                URL.revokeObjectURL(link.href);
                            } catch (error) {
                                alert("Download failed: " + error.message);
                            } finally {
                                button.disabled = false;
                            }
                        });

                        item.appendChild(button);
                    }

                    list.appendChild(item);
                });
            } catch (error) {
                list.textContent = "Could not load files: " + error.message;
            }
        });
    </script>
</body>
</html>
